
name: Release

on:
  push:
    tags:
      - '*.*.*'

jobs:
  release-crates:
    needs: release-github
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: publish package to crates
        run: |
          cargo package
          cargo publish --token ${{ secrets.CARGO_TOKEN }}

  release-docker:
    needs: release-github
    runs-on: ubuntu-latest
    env:
      IMAGE: oriontvv/convfmt
    steps:
      - uses: actions/checkout@v7

      # `latest` is moved only by stable tags, prereleases (1.2.3-rc1) get just their own tag
      - name: Docker tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # arm64 is built under emulation, so this job is slower than a native one
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release-github:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    
    steps:
    - uses: actions/checkout@v7

    - name: Get version
      id: get_version
      run: echo ::set-output name=version::${GITHUB_REF/refs\/tags\//}

    - name: Install Rust
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        profile: minimal
        components: clippy

    - name: New Resolver
      run: |
        cargo install cargo-modify --force
        cargo modify new-resolver
    - name: Build
      run: cargo build
    - name: Run tests
      run: make test
    - name: Run clippy
      run: |
        cargo clean
        make clippy
    - name: Setup MUSL
      if: matrix.os == 'ubuntu-latest'
      run: |
        rustup target add x86_64-unknown-linux-musl
        sudo apt-get -qq install musl-tools
    - name: Build Release Mac
      if: matrix.os == 'macos-latest'
      run: make release-mac
    - name: Build Release Linux
      if: matrix.os == 'ubuntu-latest'
      run: make release-linux-musl
    - name: Build Release Win
      if: matrix.os == 'windows-latest'
      run: make release-win

    - name: Set SHA
      if: matrix.os == 'macos-latest'
      id: shasum
      run: |
        echo ::set-output name=sha::"$(shasum -a 256 ./release/convfmt-mac.tar.gz | awk '{printf $1}')"
    - name: Extract release notes
      if: matrix.os == 'ubuntu-latest'
      id: release_notes
      uses: ffurrer2/extract-release-notes@v3
    - name: Release
      uses: softprops/action-gh-release@v3
      with:
        body: ${{ steps.release_notes.outputs.release_notes }}
        prerelease: ${{ contains(github.ref, '-') }}
        files: |
          ./release/*.tar.gz
          ./release/*.zip
          ./release/*.msi
          
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  bump-homebrew:
    needs: release-github
    runs-on: ubuntu-latest
    # Пропускаем pre-release (например, 2.3.4-rc1)
    if: ${{ !contains(github.ref, '-') || github.event_name == 'workflow_dispatch' }}

    steps:
      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Download release assets and compute SHA256
        id: hashes
        run: |
          set -e
          VERSION="${{ steps.version.outputs.tag }}"
          BASE_URL="https://github.com/oriontvv/convfmt/releases/download/${VERSION}"

          curl -fsSL "${BASE_URL}/convfmt-mac.tar.gz" -o convfmt-mac.tar.gz
          curl -fsSL "${BASE_URL}/convfmt-linux-musl.tar.gz" -o convfmt-linux-musl.tar.gz

          echo "mac=$(sha256sum convfmt-mac.tar.gz | awk '{print $1}')" >> $GITHUB_OUTPUT
          echo "linux=$(sha256sum convfmt-linux-musl.tar.gz | awk '{print $1}')" >> $GITHUB_OUTPUT

      - name: Generate formula
        id: formula
        run: |
          VERSION="${{ steps.version.outputs.tag }}"
          SHA_MAC="${{ steps.hashes.outputs.mac }}"
          SHA_LINUX="${{ steps.hashes.outputs.linux }}"

          cat > convfmt.rb <<EOF
          class Convfmt < Formula
            desc "CLI tool which can convert different formats"
            homepage "https://github.com/oriontvv/convfmt"
            version "${VERSION}"
            license "Apache-2.0"

            on_macos do
              url "https://github.com/oriontvv/convfmt/releases/download/${VERSION}/convfmt-mac.tar.gz"
              sha256 "${SHA_MAC}"
            end

            on_linux do
              url "https://github.com/oriontvv/convfmt/releases/download/${VERSION}/convfmt-linux-musl.tar.gz"
              sha256 "${SHA_LINUX}"
            end

            def install
              bin.install "convfmt"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/convfmt --version")
            end
          end
          EOF

          echo "Формула сгенерирована:"
          cat convfmt.rb

      - name: Checkout tap repository
        uses: actions/checkout@v7
        with:
          repository: oriontvv/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Update formula in tap
        run: |
          cp convfmt.rb homebrew-tap/Formula/convfmt.rb
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/convfmt.rb
          git commit -m "convfmt ${GITHUB_REF#refs/tags/}" || echo "No changes to commit"
          git push https://x-access-token:${{secrets.HOMEBREW_TAP_TOKEN}}@github.com/oriontvv/homebrew-tap.git
