name: Pages

# Publishes the web version (wasm) to GitHub Pages on every release tag.
# Requires "Settings -> Pages -> Source: GitHub Actions" to be enabled once.
on:
  push:
    tags:
      - '*.*.*'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true

      - uses: cargo-bins/cargo-binstall@main

      - name: Install wasm target and matching wasm-bindgen-cli
        run: make web-tools

      - name: Build web version
        run: make web-build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/static

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
