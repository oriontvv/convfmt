<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>convfmt — convert between data formats</title>
  <meta name="description" content="Convert between json, yaml, toml, xml, csv and more, right in the browser.">
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="https://cloudflare.com">
</head>

<body>
  <header>
    
    <h1>convfmt</h1>
    <span id="version" class="version">loading…</span>
    <a href="https://github.com/oriontvv/convfmt/" target="_blank" rel="noopener">
      <svg data-component="Octicon" aria-hidden="true" focusable="false" class="octicon octicon-mark-github" viewBox="0 0 24 24" width="32" height="32" fill="currentColor" display="inline-block" overflow="visible" style="vertical-align:text-bottom"><path d="M10.226 17.284c-2.965-.36-5.054-2.493-5.054-5.256 0-1.123.404-2.336 1.078-3.144-.292-.741-.247-2.314.09-2.965.898-.112 2.111.36 2.83 1.01.853-.269 1.752-.404 2.853-.404 1.1 0 1.999.135 2.807.382.696-.629 1.932-1.1 2.83-.988.315.606.36 2.179.067 2.942.72.854 1.101 2 1.101 3.167 0 2.763-2.089 4.852-5.098 5.234.763.494 1.28 1.572 1.28 2.807v2.336c0 .674.561 1.056 1.235.786 4.066-1.55 7.255-5.615 7.255-10.646C23.5 6.188 18.334 1 11.978 1 5.62 1 .5 6.188.5 12.545c0 4.986 3.167 9.12 7.435 10.669.606.225 1.19-.18 1.19-.786V20.63a2.9 2.9 0 0 1-1.078.224c-1.483 0-2.359-.808-2.987-2.313-.247-.607-.517-.966-1.034-1.033-.27-.023-.359-.135-.359-.27 0-.27.45-.471.898-.471.652 0 1.213.404 1.797 1.235.45.651.921.943 1.483.943.561 0 .92-.202 1.437-.719.382-.381.674-.718.944-.943"></path></svg>
    </a>
  </header>

  <section class="controls">
    <label>
      from
      <select id="from"></select>
    </label>
    <label>
      to
      <select id="to"></select>
    </label>
    <label class="flag">
      <input type="checkbox" id="compact">
      <code>--compact</code>
    </label>
    <label class="flag">
      <input type="checkbox" id="sort-keys">
      <code>--sort-keys</code>
    </label>
  </section>

  <p id="status" class="status" role="status"></p>

  <main>
    <section class="panel">
      <h2>input</h2>
      <textarea id="input" spellcheck="false" autocapitalize="off" autocomplete="off"
        placeholder="paste your data here"></textarea>
      <div id="input-file" class="binary" hidden>
        <p>binary format — pick a file</p>
        <input type="file" id="file">
      </div>
    </section>

    <section class="panel">
      <h2>output</h2>
      <textarea id="output" spellcheck="false" readonly placeholder="result"></textarea>
      <div id="output-file" class="binary" hidden>
        <p>binary format — download the result</p>
        <button type="button" id="download" disabled>download</button>
      </div>
    </section>
  </main>

  <footer>
    everything runs locally in your browser via WebAssembly — nothing is uploaded anywhere
  </footer>

  <script type="module" src="./app.js"></script>
</body>

</html>
